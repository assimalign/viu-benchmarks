# Performance benchmark suite ([V01.01.11.04], #88), extracted from assimalign/viu into this
# repository so that all benchmarking lives in one place.
#
# The suite consumes Viu as packages, never as a project reference. Every lane checks both
# repositories out as siblings, packs Viu at HEAD into viu/_out/packages, and threads the packed
# version through -p:ViuVersion — so the interop-count gate keeps measuring the real renderer
# instead of whatever version this repository last pinned. viu-examples' showcase workflow uses
# the same paired-checkout shape.
#
#   - harness-tests + interop-gate: fast, deterministic, run on every PR/push (path-filtered) and
#     on a schedule so a renderer change in Viu is caught even though it lands in another
#     repository. The gate compares each scenario's interop-crossing count to the reviewed
#     baseline (benchmarks/baselines/InteropCounts.json) and fails a regression. Counts are
#     machine-independent, so this is a real gate, not a noisy timing.
#   - areas, editor, browser: real measurements with separate host provenance and machine-readable history artifacts.
#
# Runners. The measuring lanes (areas, editor, browser) run on the assimalign self-hosted benchmark
# machines for the weekly schedule and for pushes, on main only; pull requests, dispatches, release
# branches, and the deterministic gates always run GitHub-hosted. Repository variables:
#   BENCHMARK_RUNNER           self-hosted label for the Linux lanes (benchmark-linux-x64)
#   BENCHMARK_RUNNER_WINDOWS   self-hosted label for the Windows lane (benchmark-windows-x64)
# Unset, every lane runs hosted. The machines are on Mondays 00:00-08:00 UTC only, so a push to main
# outside that window queues until Monday and fails if that is more than 24 hours away.
name: benchmarks

on:
  workflow_dispatch:
    inputs:
      viu-ref:
        description: Viu branch, tag, or commit to measure
        type: string
        default: main
      profile:
        description: Measurement profile
        type: choice
        options: [ci, dry]
        default: ci
  # Viu's renderer changes in a different repository, so a push filter here cannot see them. The
  # weekly run is what keeps the interop gate honest against Viu HEAD. Mondays, inside the
  # self-hosted machines' 02:00-08:00 UTC measuring window, after cohesion-benchmarks' 02:17 start.
  schedule:
    - cron: '47 2 * * 1'
  push:
    branches: [main, 'release/**']
    paths:
      - 'benchmarks/**'
      - 'harness/**'
      - 'scripts/**'
      - 'site/**'
      - 'Assimalign.Viu.Benchmarks.slnx'
      - 'CONVENTIONS.md'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/actions/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'benchmarks/**'
      - 'harness/**'
      - 'scripts/**'
      - 'site/**'
      - 'Assimalign.Viu.Benchmarks.slnx'
      - 'CONVENTIONS.md'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/actions/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-tests:
    name: benchmark harness tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          ref: ${{ inputs.viu-ref || github.head_ref || 'main' }}
          path: viu
          persist-credentials: false

      # Pure CoreCLR: the suite never touches the browser-wasm runtime, so no wasm-tools workload.
      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Build (warnings are errors)
        working-directory: viu-benchmarks
        run: >-
          dotnet build harness/Assimalign.Viu.Testing.Benchmarks/test/Assimalign.Viu.Testing.Benchmarks.Tests.csproj
          --configuration Release -warnaserror
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

      - name: Test
        working-directory: viu-benchmarks
        run: >-
          dotnet test harness/Assimalign.Viu.Testing.Benchmarks/test/Assimalign.Viu.Testing.Benchmarks.Tests.csproj
          --configuration Release --no-build
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

  interop-gate:
    name: interop-count regression gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          ref: ${{ inputs.viu-ref || github.head_ref || 'main' }}
          path: viu
          persist-credentials: false

      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Build benchmark app (warnings are errors)
        working-directory: viu-benchmarks
        run: >-
          dotnet build harness/Assimalign.Viu.Testing.Benchmarks/src/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release -warnaserror
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

      # Deterministic gate: runs every scenario through the in-memory adapter, counts node operations
      # (the interop-crossing proxy), and fails when any scenario exceeds its reviewed ceiling. The
      # ceiling is raised only by an explicit edit to benchmarks/baselines/InteropCounts.json (no
      # silent ratcheting).
      - name: Interop-count gate
        working-directory: viu-benchmarks
        run: >-
          dotnet run --project harness/Assimalign.Viu.Testing.Benchmarks/src/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release --no-build
          -- interop --gate --results _out/benchmarks/interop-results.json

      - name: Upload interop-count results
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interop-count-results
          path: viu-benchmarks/_out/benchmarks/interop-results.json
          if-no-files-found: ignore

  areas:
    name: area suites (Linux x64 JIT)
    # Self-hosted only for the schedule and pushes on main; see "Runners" above.
    runs-on: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') && vars.BENCHMARK_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: viu-benchmarks, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          ref: ${{ inputs.viu-ref || github.head_ref || 'main' }}
          path: viu
          persist-credentials: false
      - uses: ./viu-benchmarks/.github/actions/setup-dotnet
        with: { install-wasm-tools: 'true' }
      - uses: ./viu-benchmarks/.github/actions/pack-viu
        id: viu
        with: { full: 'true' }
      - name: Build and execute every non-editor area
        shell: pwsh
        working-directory: viu-benchmarks
        run: |
          $profile = if ('${{ github.event_name }}' -notin @('schedule','workflow_dispatch')) { 'dry' } elseif ('${{ inputs.profile }}') { '${{ inputs.profile }}' } else { 'ci' }
          ./scripts/Invoke-Benchmarks.ps1 -ExcludeArea Editor -Profile $profile -ViuVersion '${{ steps.viu.outputs.viu-version }}' -Output .artifacts/ci
          $revision = git -C ../viu rev-parse HEAD
          if ($profile -ne 'dry') { ./scripts/ConvertTo-BenchmarkHistory.ps1 -Path .artifacts/ci -TimeOutput .artifacts/time-linux-x64-jit.json -AllocationOutput .artifacts/allocations-linux-x64-jit.json -ViuVersion '${{ steps.viu.outputs.viu-version }}' -ViuCommit $revision }
      - name: Test report tooling
        working-directory: viu-benchmarks
        run: dotnet test scripts/tests/Assimalign.Viu.PublishBudget.Tests -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: area-results-linux-x64-jit
          path: |
            viu-benchmarks/.artifacts/ci/**
            viu-benchmarks/.artifacts/*-jit.json
            viu-benchmarks/.artifacts/subjects/editor/subject.json
          retention-days: 90

  editor:
    name: packaged editor requests (Windows x64 JIT)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Self-hosted only for the schedule on main; see "Runners" above.
    runs-on: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') && vars.BENCHMARK_RUNNER_WINDOWS) || 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: viu-benchmarks, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          ref: ${{ inputs.viu-ref || github.head_ref || 'main' }}
          path: viu
          persist-credentials: false
      - uses: ./viu-benchmarks/.github/actions/setup-dotnet
        with: { install-wasm-tools: 'true' }
      - uses: ./viu-benchmarks/.github/actions/pack-viu
        id: viu
        with: { full: 'true' }
      - name: Build the actual Visual Studio package
        shell: pwsh
        working-directory: viu
        run: ./extensions/VisualStudio/Assimalign.Viu.VisualStudio/Build.ps1 -Configuration Release
      - name: Prepare and measure the packaged server
        shell: pwsh
        working-directory: viu-benchmarks
        run: |
          ./scripts/Prepare-EditorSubject.ps1 -Vsix ../viu/_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix
          ./scripts/Invoke-Benchmarks.ps1 -Scope tooling -Area Editor -Profile ci -ViuVersion '${{ steps.viu.outputs.viu-version }}' -Output .artifacts/ci
          ./scripts/ConvertTo-BenchmarkHistory.ps1 -Path .artifacts/ci -TimeOutput .artifacts/time-windows-x64-jit.json -AllocationOutput .artifacts/allocations-windows-x64-jit.json -ViuVersion '${{ steps.viu.outputs.viu-version }}' -ViuCommit (git -C ../viu rev-parse HEAD)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: editor-results-windows-x64-jit
          path: |
            viu-benchmarks/.artifacts/ci/**
            viu-benchmarks/.artifacts/*-jit.json
            viu-benchmarks/.artifacts/subjects/editor/subject.json
          retention-days: 90

  browser:
    name: trimmed WASM scenarios (Chromium Linux x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Self-hosted only for the schedule on main; see "Runners" above.
    runs-on: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') && vars.BENCHMARK_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: viu-benchmarks, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          ref: ${{ inputs.viu-ref || github.head_ref || 'main' }}
          path: viu
          persist-credentials: false
      - uses: ./viu-benchmarks/.github/actions/setup-dotnet
        with: { install-wasm-tools: 'true' }
      - uses: ./viu-benchmarks/.github/actions/pack-viu
        id: viu
        with: { full: 'true' }
      - name: Publish and measure real WASM
        shell: pwsh
        working-directory: viu-benchmarks
        run: ./scripts/Invoke-BrowserBenchmarks.ps1 -ViuVersion '${{ steps.viu.outputs.viu-version }}' -Output .artifacts/browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: { name: browser-results-chromium-linux-x64, path: 'viu-benchmarks/.artifacts/browser/**', retention-days: 90 }
