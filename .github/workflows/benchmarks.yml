# Performance benchmark suite ([V01.01.11.04], #88), extracted from assimalign/viu into this
# repository so that all benchmarking lives in one place.
#
# The suite consumes Viu as packages, never as a project reference. Every lane checks both
# repositories out as siblings, packs Viu at HEAD into viu/_out/packages, and threads the packed
# version through -p:ViuVersion — so the interop-count gate keeps measuring the real renderer
# instead of whatever version this repository last pinned. viu-examples' showcase workflow uses
# the same paired-checkout shape.
#
#   - harness-tests + interop-gate: fast, deterministic, run on every PR/push (path-filtered) and
#     on a schedule so a renderer change in Viu is caught even though it lands in another
#     repository. The gate compares each scenario's interop-crossing count to the reviewed
#     baseline (benchmarks/baselines/InteropCounts.json) and fails a regression. Counts are
#     machine-independent, so this is a real gate, not a noisy timing.
#   - timings: BenchmarkDotNet wall-clock numbers are environment-relative and noisy, so this lane
#     is opt-in (workflow_dispatch or the 'benchmark-run' label), never a gate — the AOT-lane
#     cost-control pattern. It publishes results as artifacts.
#   - browser: WIRED-BUT-SKIPPED. The packaged-consumer Playwright harness exists in the Viu
#     repository, but #88 still needs benchmark-specific timing, live command-buffer, and
#     per-assembly payload instrumentation before this lane can produce reviewed measurements.
#     ENABLE_BROWSER_BENCHMARKS remains the explicit guard.
name: benchmarks

on:
  workflow_dispatch:
  # Viu's renderer changes in a different repository, so a push filter here cannot see them. The
  # daily run is what keeps the interop gate honest against Viu HEAD.
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main, 'release/**']
    paths:
      - 'benchmarks/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/actions/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'benchmarks/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/actions/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-tests:
    name: benchmark harness tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          path: viu
          persist-credentials: false

      # Pure CoreCLR: the suite never touches the browser-wasm runtime, so no wasm-tools workload.
      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Build (warnings are errors)
        working-directory: viu-benchmarks
        run: >-
          dotnet build benchmarks/Assimalign.Viu.Testing.Benchmarks.Tests/Assimalign.Viu.Testing.Benchmarks.Tests.csproj
          --configuration Release -warnaserror
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

      - name: Test
        working-directory: viu-benchmarks
        run: >-
          dotnet test benchmarks/Assimalign.Viu.Testing.Benchmarks.Tests/Assimalign.Viu.Testing.Benchmarks.Tests.csproj
          --configuration Release --no-build
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

  interop-gate:
    name: interop-count regression gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          path: viu
          persist-credentials: false

      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Build benchmark app (warnings are errors)
        working-directory: viu-benchmarks
        run: >-
          dotnet build benchmarks/Assimalign.Viu.Testing.Benchmarks/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release -warnaserror
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

      # Deterministic gate: runs every scenario through the in-memory adapter, counts node operations
      # (the interop-crossing proxy), and fails when any scenario exceeds its reviewed ceiling. The
      # ceiling is raised only by an explicit edit to benchmarks/baselines/InteropCounts.json (no
      # silent ratcheting).
      - name: Interop-count gate
        working-directory: viu-benchmarks
        run: >-
          dotnet run --project benchmarks/Assimalign.Viu.Testing.Benchmarks/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release --no-build
          -- interop --gate --results _out/benchmarks/interop-results.json

      - name: Upload interop-count results
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: interop-count-results
          path: viu-benchmarks/_out/benchmarks/interop-results.json
          if-no-files-found: ignore

  timings:
    name: wall-clock timings (opt-in)
    # Cost control (the AOT-lane pattern): BenchmarkDotNet timings are noisy and environment-relative,
    # so they never gate and do not run on every PR. Trigger manually (workflow_dispatch) or with the
    # 'benchmark-run' label. Numbers are published as artifacts for inspection.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark-run'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          path: viu
          persist-credentials: false

      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Build benchmark app (Release)
        working-directory: viu-benchmarks
        run: >-
          dotnet build benchmarks/Assimalign.Viu.Testing.Benchmarks/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}

      # A short run keeps CI time bounded; drop --smoke for full statistical passes when investigating.
      - name: Run benchmarks (short)
        working-directory: viu-benchmarks
        run: >-
          dotnet run --project benchmarks/Assimalign.Viu.Testing.Benchmarks/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release --no-build
          -- benchmarks --smoke --filter '*'
          --artifacts _out/benchmarks/artifacts

      - name: Upload benchmark artifacts
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-timings
          path: viu-benchmarks/_out/benchmarks/artifacts/**
          if-no-files-found: ignore

  browser:
    name: real-browser benchmarks (instrumentation deferred, #88)
    # WIRED-BUT-SKIPPED. [V01.01.11.03]/#87 supplies packaged publication, serving, headless
    # Chromium/Firefox/WebKit execution, and diagnostics from the Viu repository. #88 still must adapt
    # the benchmark app and define reviewed collection/reporting for scenario time, command-buffer
    # crossings, and payload size. No measurement is faked; enable only after that instrumentation
    # lands.
    # TODO([V01.01.11.04], #88): connect the benchmark scenarios to the real-browser harness and emit
    # the timing, crossing-count, and per-assembly payload result models.
    if: ${{ vars.ENABLE_BROWSER_BENCHMARKS == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmarks
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: viu-benchmarks
          persist-credentials: false

      - name: Checkout Viu
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: assimalign/viu
          path: viu
          persist-credentials: false

      - name: Set up .NET
        uses: ./viu-benchmarks/.github/actions/setup-dotnet

      - name: Pack Viu
        id: viu
        uses: ./viu-benchmarks/.github/actions/pack-viu

      - name: Browser benchmarks placeholder
        working-directory: viu-benchmarks
        run: >-
          dotnet run --project benchmarks/Assimalign.Viu.Testing.Benchmarks/Assimalign.Viu.Testing.Benchmarks.csproj
          --configuration Release
          -p:ViuVersion=${{ steps.viu.outputs.viu-version }}
          -- browser
